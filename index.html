open(`<button class="close" onclick="close()">×</button><h2>6. 🧹 Việc nhà</h2><p>Chạm từng việc để hoàn thành. Mỗi việc là một thao tác riêng.</p><div id="choreList">${["Rửa bát","Giặt quần áo","Đổ rác","Lau nhà"].map((x,i)=>`<button class="choice" data-c="${i}">☐ ${x}</button>`).join("")}</div><div class="event">Hoàn thành: <b id="cc">0/4</b></div>`);
let n=0;document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(b.disabled)return;b.disabled=true;b.textContent="☑ "+b.textContent.slice(2);n++;$("cc").textContent=n+"/4";state.happy=clamp(state.happy+2);state.anger=clamp(state.anger-2);renderHUD();if(n===4){toast("Nhà sạch, người vui 🏠");state.happy=clamp(state.happy+4)}})}
function phone(){open(`<button class="close" onclick="close()">×</button><div class="phone"><h2>2. 📱 Điện thoại</h2><div class="apps"><button class="app" id="msg"><b>💬</b>Tin nhắn</button><button class="app" id="social"><b>📸</b>Mạng xã hội</button><button class="app" id="bank"><b>🏦</b>Ngân hàng</button><button class="app" id="cal"><b>📅</b>Lịch</button><button class="app" id="album"><b>🖼️</b>Ảnh</button><button class="app" id="friend"><b>👥</b>Bạn bè</button></div></div>`);$("msg").onclick=messages;$("social").onclick=()=>social();$("bank").onclick=finance;$("cal").onclick=()=>toast("19:30 · Ăn tối cùng nhau ❤️");$("album").onclick=()=>toast("Album đang lưu kỷ niệm 📸");$("friend").onclick=()=>toast("Bạn thân: “Đừng nói câu đó!” 😂")}
function messages(){open(`<button class="close" onclick="close()">×</button><h2>3. 💬 Tin nhắn</h2><div class="chat">Em yêu ❤️: Anh đang làm gì đấy?</div><div class="chat me">Anh đang ở nhà nè.</div><div class="chat">Sao rep lâu thế? Ai vừa nhắn cho anh vậy? 😤</div><button class="choice" id="m1">❤️ “Anh đang nói chuyện với em mà.”</button><button class="choice" id="m2">😂 “Điện thoại đang suy nghĩ.”</button><button class="choice" id="m3">😐 “Có gì đâu.”</button>`);$("m1").onclick=()=>reply(4,4,-4,"Phản hồi ổn áp ❤️");$("m2").onclick=()=>reply(2,0,1,"Cười được nhưng vẫn hơi nghi ngờ 😂");$("m3").onclick=()=>reply(-2,-4,6,"Câu trả lời hơi cụt 😐")}
function reply(l,t,a,msg){state.love=clamp(state.love+l);state.trust=clamp(state.trust+t);state.anger=clamp(state.anger+a);toast(msg);renderHUD();state.today.push(msg)}
function social(){open(`<button class="close" onclick="close()">×</button><h2>📸 Mạng xã hội</h2><div class="event"><b>7 giây · Bài đăng #1</b><p>“Người yêu tôi bảo không đói.”</p><p>5 phút sau: “Anh ơi mua trà sữa nhé.” 😂</p></div><div class="event"><b>7 giây · Bài đăng #2</b><p>“Hôm nay chúng tôi không cãi nhau.”</p><p>Ảnh chụp 18:02 · 18:03: 37 tin nhắn.</p></div><button class="btn pink" onclick="close()">Đóng feed</button>`)}
function drama(){open(`<button class="close" onclick="close()">×</button><h2>4. 😤 Ghen tuông — Xử lý drama</h2><p>Người yêu vừa thấy một tin nhắn: “Tối nay đi cà phê không? ❤️”</p><div class="meter"><i style="width:${state.anger}%"></i></div><p>Mức giận hiện tại: <b>${state.anger}</b>/100</p><button class="btn" id="explain">💬 Giải thích</button><button class="btn pink" id="call">📞 Gọi điện</button><button class="btn green" id="gift">🎁 Tặng quà</button><button class="btn gold" id="joke">😂 Làm trò cười</button>`);
$("explain").onclick=()=>{state.trust=clamp(state.trust+5);state.anger=clamp(state.anger-12);toast("Giải thích rõ ràng: drama hạ nhiệt");renderHUD()};$("call").onclick=()=>{state.trust=clamp(state.trust+4);state.anger=clamp(state.anger-8);toast("Gọi điện nói chuyện ❤️");renderHUD()};$("gift").onclick=()=>{if(state.money<200000){toast("Không đủ tiền mua quà");return}state.money-=200000;state.love=clamp(state.love+4);state.anger=clamp(state.anger-5);toast("Quà đã tới tay 🎁");renderHUD()};$("joke").onclick=()=>{state.anger=clamp(state.anger-3);state.happy=clamp(state.happy+2);toast("Cười được nhưng vẫn còn giận 😂");renderHUD()}}
function work(){open(`<button class="close" onclick="close()">×</button><h2>7. 💼 Đi làm</h2><p>Nhân viên văn phòng · 08:00–17:00</p><div class="meter"><i style="width:${state.energy}%"></i></div><p>Năng lượng ${state.energy}%</p><button class="btn" id="email">📧 Xử lý email · +160.000đ</button><button class="btn" id="report">📄 Làm báo cáo · +220.000đ</button>`);$("email").onclick=()=>job(160000,7);$("report").onclick=()=>job(220000,10)}
function job(p,e){if(state.energy<e){toast("Hết năng lượng 😴");return}state.money+=p;state.energy-=e;state.finance=clamp(state.finance+2);toast("Hoàn thành · +"+cash(p));renderHUD()}
function finance(){open(`<button class="close" onclick="close()">×</button><h2>8. 💰 Tài chính</h2><div class="cards"><div class="card"><b>Lương tháng</b><h3>12.000.000đ</h3></div><div class="card"><b>Tiền hiện có</b><h3>${cash(state.money)}</h3></div></div><div class="event"><b>Nguyên tắc:</b> yêu nhau cần thời gian, nhưng cuộc sống cũng cần tiền. Cân bằng cả hai.</div>`)}
function date(){open(`<button class="close" onclick="close()">×</button><h2>9. ❤️ Hẹn hò</h2><div class="cards">${[["🍜 Quán ăn",300000,10],["🎬 Rạp phim",500000,8],["🌳 Công viên",200000,7],["☕ Cà phê",150000,6]].map((x,i)=>`<div class="card"><b>${x[0]}</b><p>${cash(x[1])} · ❤️ +${x[2]}</p><button class="btn pink" data-d="${i}">Đi hẹn hò</button></div>`).join("")}</div>`);let ds=[[300000,10],[500000,8],[200000,7],[150000,6]];document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{let [p,l]=ds[+b.dataset.d];if(state.money<p){toast("Không đủ tiền 😅");return}state.money-=p;state.love=clamp(state.love+l);state.trust=clamp(state.trust+3);state.happy=clamp(state.happy+5);state.anger=clamp(state.anger-4);toast("Buổi hẹn rất vui ❤️");renderHUD()})}
function shop(){let ks=["sofa","tv","kitchen","fridge","washer","bed","table","plant"],ns={sofa:"🛋️ Sofa",tv:"📺 TV",kitchen:"🍳 Bếp",fridge:"🧊 Tủ lạnh",washer:"🧺 Máy giặt",bed:"🛏️ Giường",table:"🍽️ Bàn ăn",plant:"🌿 Cây cảnh"};open(`<button class="close" onclick="close()">×</button><h2>10. 🛒 Mua sắm & nâng cấp</h2><p class="small">Không di chuyển đồ vật. Chỉ nâng cấp asset tại vị trí cố định.</p><div class="cards">${ks.map(k=>{let l=state.lv[k],p=Math.round(500000*Math.pow(1.55,l-1));return `<div class="card"><b>${ns[k]}</b><div class="small">Cấp ${l}/3</div><button class="btn gold" data-u="${k}" ${l>=3||state.money<p?"disabled":""}>${l>=3?"MAX":"⬆️ "+cash(p)}</button></div>`}).join("")}</div>`);document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{let k=b.dataset.u,p=Math.round(500000*Math.pow(1.55,state.lv[k]-1));if(state.money>=p&&state.lv[k]<3){state.money-=p;state.lv[k]++;state.finance=clamp(state.finance+3);state.happy=clamp(state.happy+2);toast("Nâng cấp thành công!");renderHUD();world();shop()}})}
function cohab(){open(`<button class="close" onclick="close()">×</button><h2>11. 👫 Hai người cùng sống</h2><p>Buổi tối sau giờ làm. Hai người có thể tự tạo “nhịp sống” bằng các hoạt động.</p><div class="cards"><div class="card"><b>👨</b><p>Về nhà · 18:10</p></div><div class="card"><b>👩</b><p>Nấu ăn · 18:15</p></div><div class="card"><b>🍚</b><p>Ăn tối · 19:00</p></div><div class="card"><b>📺</b><p>Xem TV · 20:30</p></div></div><button class="btn pink" onclick="toast('Hai người cùng nói chuyện ❤️')">💬 Nói chuyện</button>`)}
function endDay(){open(`<button class="close" onclick="close()">×</button><h2>12. 🌙 Kết thúc ngày</h2><div class="event"><p>❤️ Tình yêu: +${state.today.length+2}</p><p>🤝 Tin tưởng: +2</p><p>😤 Giận: -4</p><p>🏠 Hạnh phúc: +4</p></div><button class="btn pink" id="sleep">🌙 Đi ngủ</button>`);$("sleep").onclick=()=>nextDay()}
function randomEvent(){let r=Math.random();if(r<.25)open(`<button class="close" onclick="close()">×</button><h2>13. 🎲 Sự kiện ngẫu nhiên</h2><div class="event"><b>📞 Mẹ người yêu gọi video</b><p>“Hai đứa ăn cơm chưa?”</p><button class="btn green" onclick="state.happy=clamp(state.happy+3);toast('Trả lời lễ phép: +hạnh phúc');renderHUD()">Trả lời</button></div>`);else if(r<.5)open(`<button class="close" onclick="close()">×</button><h2>13. 🎲 Sự kiện ngẫu nhiên</h2><div class="event"><b>🔋 Điện thoại hết pin</b><p>Đúng lúc người yêu đang giận...</p><button class="btn pink" onclick="state.anger=clamp(state.anger+7);toast('Drama tăng 😭');renderHUD()">Xử lý</button></div>`);else toast("13. 🎲 Không có drama hôm nay — hiếm lắm 😂")}
function progress(){open(`<button class="close" onclick="close()">×</button><h2>14. 📈 Tiến trình game</h2><div class="event"><b>Chương 1 — MỚI YÊU</b><p>Hẹn hò, nhắn tin, làm quen</p></div><div class="event"><b>Chương 2 — YÊU LÂU</b><p>Cùng đi chơi, tin tưởng, xử lý ghen tuông</p></div><div class="event"><b>Chương 3 — SỐNG CHUNG</b><p>Nhà cửa, việc nhà, tài chính</p></div><div class="event"><b>Chương 4 — HÔN NHÂN</b><p>Trách nhiệm, gia đình</p></div><div class="event"><b>Chương 5 — GIA ĐÌNH</b><p>Cuộc sống lâu dài</p></div>`)}
function status(){open(`<button class="close" onclick="close()">×</button><h2>15. 📊 Thanh trạng thái</h2><p>❤️ Tình yêu <b>${state.love}</b></p><div class="meter"><i style="width:${state.love}%"></i></div><p>🤝 Tin tưởng <b>${state.trust}</b></p><div class="meter"><i style="width:${state.trust}%"></i></div><p>😤 Giận / Căng thẳng <b>${state.anger}</b></p><div class="meter"><i style="width:${state.anger}%"></i></div><p>💰 Tài chính <b>${state.finance}</b></p><div class="meter"><i style="width:${state.finance}%"></i></div><p>🏠 Hạnh phúc <b>${state.happy}</b></p><div class="meter"><i style="width:${state.happy}%"></i></div><div class="event"><b>Ảnh hưởng lẫn nhau</b><p>Có tiền nhưng ít thời gian → tình yêu giảm.</p><p>Hẹn hò nhiều nhưng tiêu quá mức → tài chính giảm.</p><p>Làm việc nhà → giận giảm, hạnh phúc tăng.</p><p>Drama nhiều → sự kiện khó hơn.</p></div>`)}
function nextDay(){state.day++;state.h=7;state.m=30;state.energy=100;state.today=[];state.anger=clamp(state.anger-6);state.happy=clamp(state.happy+2);if(state.day>7){state.day=1;state.money+=12000000;toast("💰 Lương tháng +12.000.000đ")}else toast("🌅 Ngày mới bắt đầu");renderHUD();world();save()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");let t=b.dataset.tab;if(t==="home"){world();hotspots()}if(t==="phone")phone();if(t==="work")work();if(t==="date")date();if(t==="shop")shop()});
load();renderHUD();world();hotspots();setTimeout(()=>toast("1. 🏠 Nhà — chạm trực tiếp vào đồ vật để chơi"),500);</script></body></html>
