</svg></div></div><div id="sceneLayer"><div class="sceneTop"><span class="sceneTitle" id="sceneTitle"></span><button class="sceneBack" onclick="returnHomeScene()">🏠 Về nhà</button></div><div id="sceneContent"></div></div><div class="tv-screen" style="position:absolute;left:68%;top:18%;z-index:6;font-size:20px;display:none">📺</div><div id="pet" onclick="petMenu()"><div class="petBody"></div><div class="petHead"><span class="petEar1"></span><span class="petEar2"></span><span class="petEye"></span></div><div class="petLeg pl1"></div><div class="petLeg pl2"></div><div class="petTail"></div></div><div id="hotspots"></div><div id="toast"></div><div id="modal"><div class="sheet" id="sheet"></div></div></main><nav><button class="active" data-tab="home">🏠<br>Nhà</button><button data-tab="phone">📱<br>Điện thoại</button><button data-tab="work">💼<br>Đi làm</button><button data-tab="date">❤️<br>Hẹn hò</button><button data-tab="shop">🛒<br>Cửa hàng</button></nav></div><script>
const S={
 day:2,h:18,m:35,money:3200000,love:78,trust:74,anger:12,finance:61,happy:84,energy:76,
 upgrades:{sofa:1,tv:1,kitchen:1,fridge:1,bed:1},
 chores:{dish:false,laundry:false,trash:false,floor:false},
 work:{email:0,report:0,meeting:0},
 chatIndex:0, socialIndex:0, lastRoutine:-1, player:'boy', partner:'girl', inventory:{rice:2,veg:2,fish:1,meat:1,shrimp:1,egg:6,noodle:4}, fridgeOpen:false, pet:{type:'cat',name:'Miu',hunger:72,happy:78,clean:84,energy:88,food:{dry:3,wet:2,treat:1}}, unread:0, inbox:{love:[],best:[],friend:[],family:[],coworker:[]}, messageSeq:0, cooking:null, scene:'home', clean:100, playerGenderChosen:true,freeActive:null,busy:false, busy:false
};
const $=id=>document.getElementById(id);
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const fmt=n=>n.toLocaleString('vi-VN')+'đ';
const waitMs=ms=>new Promise(r=>setTimeout(r,ms));

function hud(){
 $('time').textContent=`Ngày ${S.day} · ${String(S.h).padStart(2,'0')}:${String(S.m).padStart(2,'0')}`;
 $('money').textContent=fmt(S.money);
 const vals=[S.love,S.trust,S.anger,S.finance,S.happy];
 document.querySelectorAll('.stat').forEach((e,i)=>{
   const t=e.childNodes[0]; if(t) t.textContent=['❤️ '+S.love,'🤝 '+S.trust,'😤 '+S.anger,'💰 '+S.finance,'🏠 '+S.happy][i];
   const bar=e.querySelector('i'); if(bar) bar.style.width=vals[i]+'%';
 });
}
function toast(t){
 const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);
 window.tt=setTimeout(()=>e.style.display='none',1800);
}
function closeModal(){ $('modal').style.display='none'; $('sheet').innerHTML=''; }
function show(t,after){
 $('sheet').innerHTML=t+'<button class="btn" id="x">Đóng</button>';
 $('modal').style.display='flex';
 $('x').onclick=()=>{closeModal();after&&after()};
}
function btn(label,fn,cls='btn'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function changeTime(min){
 S.m+=min; while(S.m>=60){S.m-=60;S.h++} while(S.h>=24){S.h-=24;S.day++}
 hud();
}
function effect(kind,n=1){
 if(kind==='love')S.love=clamp(S.love+n);
 if(kind==='trust')S.trust=clamp(S.trust+n);
 if(kind==='anger')S.anger=clamp(S.anger+n);
 if(kind==='happy')S.happy=clamp(S.happy+n);
 if(kind==='energy')S.energy=clamp(S.energy+n);
}
function fx(emoji,x=50,y=45){
 const f=document.createElement('div');f.className='fx';f.textContent=emoji;f.style.left=x+'%';f.style.top=y+'%';
 $('roomFX').appendChild(f);setTimeout(()=>f.remove(),950);
}
function say(text,who='girl',ms=2200){
 const e=$('speech');e.textContent=text;e.style.display='block';
 const c=$(who); if(c){e.style.left=(parseFloat(c.style.left)||50)+8+'%';e.style.top=Math.max(4,(parseFloat(c.style.top)||50)-8)+'%';c.classList.add('talking');setTimeout(()=>c.classList.remove('talking'),ms)}
 clearTimeout(window.speechTimer);window.speechTimer=setTimeout(()=>e.style.display='none',ms);
}

async function moveNPC(who,left,top,text){
 const c=$(who);if(!c)return;
 c.style.display='block';c.classList.add('walking');c.style.left=left+'%';c.style.top=top+'%';
 if(text)setTimeout(()=>say(text,who,1700),500);
 await waitMs(850);c.classList.remove('walking');
}
function homeSchedule(){
 const absent=(S.h>=7&&S.h<11)||(S.h>=14&&S.h<17);
 const partner=$(S.partner); if(partner) partner.style.display=absent?'none':'block';
 if(absent && S.scene==='home') { if(!S._workNotified){S._workNotified=true;toast('💼 '+(S.partner==='girl'?'Em':'Anh')+' đang đi làm');} } else S._workNotified=false;
}
function returnHomeScene(){
 S.scene='home';$('sceneLayer').classList.remove('show');$('room').style.display='block';$('pet').style.display='block';homeSchedule();closeModal();hud();
}
function setScene(type,title,html,cls=''){
 S.scene=type;$('room').style.display='none';$('pet').style.display='none';const layer=$('sceneLayer');layer.className='show';$('sceneTitle').textContent=title;const c=$('sceneContent');c.innerHTML=html;c.className=cls;
}
function say(text,who='girl',ms=2200){const e=$('speech');e.textContent=text;e.style.display='block';const c=$(who);if(c){e.style.left=(parseFloat(c.style.left)||50)+8+'%';e.style.top=Math.max(4,(parseFloat(c.style.top)||50)-8)+'%';c.classList.add('talking');setTimeout(()=>c.classList.remove('talking'),ms)}clearTimeout(window.speechTimer);window.speechTimer=setTimeout(()=>e.style.display='none',ms)}
function fx(emoji,x=50,y=45){const f=document.createElement('div');f.className='fx';f.textContent=emoji;f.style.left=x+'%';f.style.top=y+'%';$('roomFX').appendChild(f);setTimeout(()=>f.remove(),950)}
async function routine(scene='idle'){
 if(S.scene!=='home'||S.busy)return;
 S.busy=true;
 try{
  if(scene==='cook'){await moveNPC('boy',34,47,'Để anh lấy đồ!');await moveNPC('girl',23,49,'Em nấu nhé 😋')}
  else if(scene==='tv'){await moveNPC('boy',39,55,'Bật TV nha.');await moveNPC('girl',57,57,'Ngồi sát vào!');tvOn()}
  else if(scene==='table'){await moveNPC('boy',43,67,'Đói quá...');await moveNPC('girl',61,68,'Chờ em!')}
  else if(scene==='bed'){await moveNPC('boy',14,78,'Ngủ thôi...');await moveNPC('girl',19,80,'Ngủ ngon ❤️')}
  else if(scene==='fight'){await moveNPC('girl',65,51,'Anh giải thích đi! 😤');await moveNPC('boy',33,51,'Khoan... khoan...')}
 }finally{S.busy=false}
}

function hit(x,y,w,h,fn){let b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x/360*100}%;top:${y/480*100}%;width:${w/360*100}%;height:${h/480*100}%`;b.onclick=fn;$('hotspots').appendChild(b)}
function tvOn(){let t=document.querySelector('.tv-screen');if(t){t.textContent='📺';t.style.display='block';t.style.animation='tvf .35s steps(2,end) infinite'}}
function init(){
 hit(5,90,112,112,()=>{toast('🍳 Bếp — bạn có thể nấu tự do hoặc chọn món');show(`<h2>🍳 Bếp</h2><p class="card">Bạn có thể đứng nấu tự do 1 phút, hoặc bắt đầu một món cụ thể.</p>${btn('🍳 Nấu tự do 1 phút','startFreeActivity(\'cook\')','pink')}${btn('🍲 Chọn món nấu','cook()','choice')}`)});
 hit(110,90,82,112,()=>fridge());
 hit(204,62,126,105,()=>startFreeActivity('tv'));
 hit(178,109,180,132,()=>live());
 hit(200,218,180,132,()=>{routine('table');show(`<h2>🍚 Bàn ăn</h2><p class="card">Bàn ăn chỉ có ý nghĩa khi có đồ ăn thật.</p>${btn('🥢 Ăn cùng nhau','eatMeal()')}`)});
 hit(268,315,92,101,()=>chores());
 hit(1,371,177,109,()=>sleep());
 hit(137,238,168,138,()=>live());
 hit(250,360,75,80,()=>petMenu());
 decorateHomeObjects();
 homeSchedule();
}
function fridge(){
  const items=[['rice','🍚 Gạo'],['veg','🥬 Rau'],['fish','🐟 Cá'],['meat','🥩 Thịt'],['shrimp','🦐 Tôm'],['egg','🥚 Trứng'],['noodle','🍜 Mì']];
  show(`<h2>🧊 Tủ lạnh</h2><p>Đây chỉ là <b>kho thực phẩm</b>. Tủ lạnh <b>không có chức năng chọn hoặc nấu món</b>.</p><div class="cards">${items.map(x=>`<div class="card">${x[1]}<br><b>${S.inventory[x[0]]}</b> phần</div>`).join('')}</div><p class="card">🍳 Muốn nấu ăn: chạm vào <b>khu vực Bếp</b> trong nhà.</p>${btn('🛒 Mở Cửa hàng','closeModal();shop()','gold')}`)
}
function grocery(){shop()}

const recipes=[
 {name:'🍜 Mì trứng rau',need:{noodle:1,egg:1,veg:1},steps:[['🔥 Bật bếp — làm nóng',15],['💧 Đun nước sôi',10],['🍜 Pha mì',5],['🍽️ Bê ra bàn',5]]},
 {name:'🍳 Trứng rau',need:{egg:2,veg:1},steps:[['🔥 Bật bếp — làm nóng',8],['🍳 Chiên trứng',8],['🥬 Cho rau',5],['🍽️ Bê ra bàn',5]]}
];
function recipeText(r){return Object.entries(r.need).map(([k,n])=>{const names={rice:'🍚 Gạo',veg:'🥬 Rau',fish:'🐟 Cá',meat:'🥩 Thịt',shrimp:'🦐 Tôm',egg:'🥚 Trứng',noodle:'🍜 Mì'};return `${names[k]} ${S.inventory[k]}/${n}`}).join(' · ')}
function cook(){
  if(S.scene!=='home')returnHomeScene();
  if(S.cooking)return toast('🍳 Món đang được nấu, làm xong món này trước nhé');
  show(`<h2>🍳 Chọn món nấu</h2><p class="card">Chọn món trước. <b>Nguyên liệu chỉ bị trừ khi bạn bắt đầu nấu</b>.</p><div class="cards">${recipes.map((r,i)=>`<div class="card"><b>${r.name}</b><p>${recipeText(r)}</p><button class="btn pink" onclick="startCooking(${i})">${Object.entries(r.need).every(([k,n])=>S.inventory[k]>=n)?'🍳 Nấu món này':'🔒 Thiếu nguyên liệu'}</button></div>`).join('')}</div>${btn('🧊 Xem tủ lạnh','fridge()','choice')}`)
}
async function startCooking(i){
  const r=recipes[i];
  for(const k in r.need){if((S.inventory[k]||0)<r.need[k])return toast('🧊 Thiếu nguyên liệu — vào Cửa hàng để mua thêm');}
  if(S.busy)return toast('⏳ Hai người đang bận, chờ một chút');
  closeModal();
  S.busy=true;
  try{await moveNPC('boy',34,47,'Để anh lấy đồ!');await moveNPC('girl',23,49,'Em nấu nhé 😋');}
  finally{S.busy=false}
  for(const k in r.need)S.inventory[k]-=r.need[k];
  S.cooking={recipe:r,step:0,remain:r.steps[0][1],deadline:0,timer:null,serveTimer:null};
  renderCookStep();
}
function renderCookStep(){
  const c=S.cooking;if(!c)return;
  const step=c.recipe.steps[c.step];
  show(`<h2>🍳 ${c.recipe.name}</h2><p><b>Bước ${c.step+1}/${c.recipe.steps.length}: ${step[0]}</b></p><div class="taskbar"><i id="cookbar" style="width:100%"></i></div><p>Còn <b id="cooktime">${step[1]}</b> giây</p><p class="card">Nguyên liệu đã được lấy từ tủ lạnh. Không thể mua thực phẩm trong màn này — muốn mua, hãy vào <b>🛒 Cửa hàng</b>.</p><button class="btn pink" id="cookWait">🔥 Bắt đầu bước</button>`);
  $('cookWait').onclick=()=>runCookTimer();
}
function runCookTimer(){
  const c=S.cooking;if(!c||c.timer)return;
  const step=c.recipe.steps[c.step];let remain=step[1];
  const b=$('cookWait');if(b){b.disabled=true;b.textContent='⏳ Đang thực hiện...'}
  c.timer=setInterval(()=>{
    remain--;if($('cooktime'))$('cooktime').textContent=remain;if($('cookbar'))$('cookbar').style.width=(remain/step[1]*100)+'%';
    if(remain<=0){clearInterval(c.timer);c.timer=null;finishCookStep()}
  },1000);
}
async function finishCookStep(){
  const c=S.cooking;if(!c)return;
  c.step++;
  if(c.step>=c.recipe.steps.length){
    S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(1);hud();
    await routine('table');
    show(`<h2>🍽️ Món ăn đã được bê ra bàn</h2><div class="card">Hai người ăn tối cùng nhau. Không nhận tiền — đây là bữa cơm của nhà mình ❤️</div>${btn('🥢 Ăn cùng nhau','eatMeal()')}`);return;
  }
  if(c.step===c.recipe.steps.length-1){
    c.deadline=5;
    show(`<h2>🍽️ ${c.recipe.name} đã chín!</h2><p class="card">Món đã chín. Bấm <b>Bê ra bàn</b> để hoàn tất. Nếu chưa muốn bê, bạn vẫn có thể thao tác trong 5 giây.</p><button class="btn pink" id="serveBtn" onclick="serveMeal()">🍽️ Bê ra bàn ngay</button>`);
    let n=5;c.serveTimer=setInterval(()=>{n--;if($('serveBtn'))$('serveBtn').textContent=`🍽️ Bê ra bàn ngay (${n}s)`;if(n<=0){clearInterval(c.serveTimer);c.serveTimer=null;if(S.cooking)fireReset()}},1000);return;
  }
  renderCookStep();
}
async function serveMeal(){
  const c=S.cooking;if(!c)return;
  if(c.serveTimer){clearInterval(c.serveTimer);c.serveTimer=null}
  S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(1);hud();
  await routine('table');

 {id:'wifi',need:()=>S.scene==='home',title:'📶 WIFI DỞ CHỨNG',text:'Wi-Fi tự nhiên yếu đúng lúc cần nó nhất.',lines:['Không phải Wi-Fi yếu. Nó đang suy nghĩ.','Tắt mở modem đi... niềm tin vào công nghệ.'],fx:'📶'},
 {id:'emptyfridge',need:()=>S.scene==='home'&&Object.values(S.inventory).reduce((a,b)=>a+b,0)<=5,title:'🧊 TỦ LẠNH TRỐNG',text:'Mở tủ lạnh và phát hiện hiện thực.',lines:['Còn gì ăn không?','Còn. Còn niềm hy vọng.'],fx:'🫠'},
 {id:'money',need:()=>S.scene==='home'&&S.money<800000,title:'💸 TÀI KHOẢN CẢNH BÁO',text:'Số dư đang nhìn bạn bằng ánh mắt thất vọng.',lines:['Mình nghèo tạm thời thôi.','Tạm thời của anh kéo dài hơi lâu.'],fx:'💸'},
 {id:'pet',need:()=>S.scene==='home'&&S.pet.hunger<30,title:'🐾 BOSS ĐÒI ĂN',text:'Thú cưng nhìn bạn. Bạn nhìn thú cưng. Cả hai đều hiểu.',lines:['Boss đang đói.','Boss có quyền biểu tình.'],fx:'🐾'},
 {id:'lazy',need:()=>S.scene==='home'&&S.energy<25,title:'🥱 HẾT PIN CON NGƯỜI',text:'Năng lượng thấp nhưng điện thoại vẫn 100%.',lines:['Đi ngủ đi.','Lát nữa.'],fx:'🥱'}
];
function v20RandomEvent(){
 if(S.v20.eventCooldown>0){S.v20.eventCooldown--;return;}
 if(S.scene!=='home'||S.v20.free||S.v20.actionBusy)return;
 if(Math.random()>0.18)return;
 const available=V20_EVENTS.filter(e=>e.need());if(!available.length)return;
 const e=available[Math.floor(Math.random()*available.length)];S.v20.eventCooldown=4;S.v20.eventCount++;S.v20.lastEvent=e.id;
 const who=S.partner;v20FX(e.fx,50,42);v20Say(e.lines[0],who,1700);setTimeout(()=>v20Say(e.lines[1],S.player,1700),900);toast(e.title+' — '+e.text);
}

const V20_ROUTINES=[
 {type:'kitchen',at:[31,48],say:'Để anh/em xem bếp hôm nay có ổn không.'},
 {type:'tv',at:[63,56],say:'Xem một chút thôi nha.'},
 {type:'table',at:[72,65],say:'Tới bàn xem có gì ăn nào.'},
 {type:'petarea',at:[82,75],say:'Boss ơi, lại đây.'},
 {type:'sofa',at:[58,59],say:'Ngồi nghỉ một lát.'}
];
async function v20PartnerRoutine(){
 if(S.scene!=='home'||S.v20.free||S.v20.actionBusy||S.cooking)return;
 if(S.h>=7&&S.h<11){return;} // đi làm buổi sáng
 if(S.h>=14&&S.h<17){return;}
 if(Math.random()>0.48)return;
 const r=V20_ROUTINES[Math.floor(Math.random()*V20_ROUTINES.length)];
 const who=S.partner; S.v20.actionBusy=true;
 try{
   await v20Move(who,r.at[0],r.at[1],r.say);
   if(r.type==='tv'){tvOn();v20FX('📺',70,40);}
   if(r.type==='kitchen'){v20FX('🍳',32,46);}
   if(r.type==='table'){v20FX('🍚',73,62);}
   if(r.type==='petarea'){await petMove(74,72);v20FX('🐾',78,70);}
   if(r.type==='sofa'){v20FX('🛋️',60,57);}
 } finally {S.v20.actionBusy=false;}
}

function v20Chore(k,who){
 closeModal(); if(S.scene!=='home')returnHomeScene(); if(S.chores[k])return toast('☑️ Việc này đã xong');
 const pos={dish:[68,61],laundry:[78,75],trash:[15,62],floor:[55,72]}[k]; const action={dish:'🍽️',laundry:'👕',trash:'🗑️',floor:'🧹'}[k];
 S.busy=true; moveNPC(who,pos[0],pos[1],action+' Bắt đầu làm nhé!').then(()=>{
   v20FX(action,pos[0],pos[1]);
   let n=3; const iv=setInterval(()=>{v20FX(action,pos[0]+Math.random()*4-2,pos[1]+Math.random()*4-2);n--;if(n<=0){clearInterval(iv);S.chores[k]=true;S.clean=clamp(S.clean+5);effect('happy',2);effect('anger',-2);changeTime(8);S.busy=false;hud();toast('✅ Đã hoàn thành: '+action);chores();}},500);
 });
}

 const hs=$('hotspots'); if(!hs)return; hs.innerHTML='';
 const add=(x,y,w,h,fn)=>hit(x,y,w,h,fn);
 add(5,90,112,112,()=>v20DoObject('kitchen'));
 add(110,90,82,112,()=>v20DoObject('fridge'));
 add(204,62,126,105,()=>v20DoObject('tv'));
 add(204,105,126,105,()=>v20DoObject('sofa'));
 add(200,218,160,132,()=>v20DoObject('table'));
 add(1,371,177,109,()=>v20DoObject('bed'));
 add(1,260,100,130,()=>v20DoObject('plant'));
 add(250,360,75,80,()=>v20DoObject('petarea'));
 // Không còn mục “11. Sống cùng nhau” đè lên đồ vật.
}

function v20RefreshLabels(){
 decorateHomeObjects();
 document.querySelectorAll('#room .asset').forEach((e,i)=>{if(e.dataset.object){e.title=e.dataset.objectName||'';}});
}

function v20Upgrade(k){
 const d=upgradeData[k],lv=S.upgrades[k],cost=d.cost[lv];
 if(lv>=d.max)return toast('⭐ Đã tối đa');
 if(S.money<cost)return toast('💸 Chưa đủ tiền — đi làm thêm nhé');
 S.money-=cost;S.upgrades[k]++;effect(d.stat,4);effect('finance',-2);hud();visualUpgrade(k);v20FX('✨',55,55);toast(`${d.name} cấp ${S.upgrades[k]} — ngoại hình đã thay tại đúng vị trí!`);setTimeout(()=>v20RefreshLabels(),50);V20_ORIG_SHOP();
}

function v20Shop(){
 V20_ORIG_SHOP();
 setTimeout(()=>{
   const sheet=$('sheet'); if(!sheet)return;
   sheet.insertAdjacentHTML('afterbegin',`<div class="v20ShopBanner"><b>🏠 ĐỒ VẬT CỐ ĐỊNH</b><br><small>Mua/nâng cấp chỉ thay ngoại hình tại đúng vị trí — NPC không bị mất điểm tương tác.</small></div>`);
 },0);
}

function v20Install(){
 document.title='YÊU NHAU CÓ GÌ VUI? — V20';
 // thay các function chính bằng bản V20
 window.shop=v20Shop; window.upgrade=v20Upgrade; window.social=v20Social;
 // Chores được thay bằng hành động có animation thật
 window.chores=function(){const list=[['dish','🍽️ Rửa bát','girl'],['laundry','👕 Giặt quần áo','boy'],['trash','🗑️ Đổ rác','girl'],['floor','🧹 Lau nhà','boy']];show('<h2>🧹 VIỆC NHÀ</h2><p class="card">NPC sẽ đi tới đúng vị trí rồi thực hiện hành động.</p>'+list.map(([k,x,w])=>`<button class="choice" onclick="v20Chore('${k}','${w}')">${S.chores[k]?'☑️':'☐'} ${x}</button>`).join('')+'<p class="card">Độ sạch nhà: '+S.clean+'%</p>')};
 // routine mới, vẫn tương thích với các hệ thống cũ
 window.routine=async function(scene='idle'){
   if(S.scene!=='home'||S.v20.free||S.v20.actionBusy)return;
   if(scene==='cook'){return v20Move(S.partner,31,48,'Để anh/em xem bếp một chút.').then(()=>v20FX('🍳',32,46));}
   if(scene==='tv'){return Promise.all([v20Move(S.partner,63,56,'Xem TV một chút nha.'),v20Move(S.player,58,59,'Ừ, xem đi.')]).then(()=>{tvOn();v20FX('📺',70,40);});}
   if(scene==='table'){return v20Move(S.partner,72,65,'Tới bàn xem có gì ăn nào.').then(()=>v20FX('🍚',73,62));}
   if(scene==='bed')return v20DoObject('bed');
   if(scene==='fight'){await v20Move('girl',65,51,'Anh giải thích đi! 😤');await v20Move('boy',33,51,'Khoan... khoan...');return;}
   return v20PartnerRoutine();
 };
 // Rebuild interaction layer after original init has run.
 v20RebuildHotspots();v20RefreshLabels();
 // Remove old live action remnants if any are visible.
 document.querySelectorAll('.hot').forEach(b=>b.setAttribute('aria-label','Tương tác đồ vật'));
 // extra trend button on phone via delegation
 const oldPhone=window.phone; window.phone=function(){oldPhone();setTimeout(()=>{const s=$('sheet');if(s)s.insertAdjacentHTML('beforeend',btn('🔥 Trend hôm nay','v20Social()','choice'));},0)};
 // Ensure partner AI and events tick independently.
 setInterval(()=>v20RandomEvent(),5000);
 setInterval(()=>{if(S.scene==='home'&&!S.v20.free&&!S.v20.actionBusy)v20PartnerRoutine()},11000);
 toast('✨ V20 đã sẵn sàng — đồ vật, hành động, AI, trend và sự kiện hoạt động');
}

v20Install();


/* V20 cooking/fridge safety overrides */
function v20Fridge(){
  show(`<h2>🧊 TỦ LẠNH</h2><p class="card">Tủ lạnh chỉ dùng để xem kho. Muốn mua đồ → CỬA HÀNG. Muốn nấu → BẾP.</p><div class="cards">${[['rice','🍚 Gạo'],['veg','🥬 Rau'],['fish','🐟 Cá'],['meat','🥩 Thịt'],['shrimp','🦐 Tôm'],['egg','🥚 Trứng'],['noodle','🍜 Mì']].map(x=>`<div class="card">${x[1]}<br><b>${S.inventory[x[0]]}</b></div>`).join('')}</div>${btn('🛒 Mở Cửa hàng','V20_ORIG_SHOP()','gold')}${btn('🍳 Đi tới Bếp','v20DoObject("kitchen")','pink')}`);
}
function v20RenderCookStep(){
 const c=S.cooking;if(!c)return;const step=c.recipe.steps[c.step];
 show(`<h2>🍳 ${c.recipe.name}</h2><p><b>${step[0]}</b></p><div class="taskbar"><i id="cookbar" style="width:100%"></i></div><p>Còn <b id="cooktime">${step[1]}</b> giây</p><p class="card">NPC vẫn có thể tự hoạt động quanh nhà trong lúc bếp chạy.</p><button class="btn pink" id="cookWait">⏳ Bắt đầu bước</button>`);
 $('cookWait').onclick=()=>v20RunCookTimer();
}
function v20RunCookTimer(){
 const c=S.cooking;if(!c)return;const step=c.recipe.steps[c.step];let remain=step[1];const b=$('cookWait');if(b)b.disabled=true;
 const iv=setInterval(()=>{remain--;if($('cooktime'))$('cooktime').textContent=remain;if($('cookbar'))$('cookbar').style.width=(remain/step[1]*100)+'%';if(remain<=0){clearInterval(iv);v20FinishCookStep()}},1000);
}
function v20FinishCookStep(){
 const c=S.cooking;if(!c)return;c.step++;
 if(c.step>=c.recipe.steps.length){
   S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(2);hud();
   v20Move(S.player,72,65,'Món xong rồi, bê ra bàn thôi.').then(()=>{v20FX('🍽️',74,62);show(`<h2>🍽️ ${c.recipe.name} hoàn thành!</h2><div class="card">Không có “cháy nhà, reset game”. Món ăn hoàn thành bình thường 😎</div>${btn('🥢 Ăn cùng nhau','eatMeal()','pink')}`)});
   return;
 }
 v20RenderCookStep();
}
function v20InstallCooking(){
 window.fridge=v20Fridge;
 window.cook=()=>v20DoObject('kitchen');
 window.renderCookStep=v20RenderCookStep;
 window.runCookTimer=v20RunCookTimer;
 window.finishCookStep=v20FinishCookStep;
}
v20InstallCooking();
