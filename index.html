<html lang="vi">
<head>

<title>YÊU NHAU CÓ GÌ VUI? — V3</title>
<style>
:root{--ink:#292638;--paper:#fff1d7;--paper2:#f7dfbd;--pink:#ef7fa8;--blue:#5e9fd8;--green:#70a36b;--gold:#e5b34c;--red:#e66d78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#11111d;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;min-height:100vh}
#game{width:min(430px,100%);background:#222235;overflow:hidden;min-height:100vh}
#hud{padding:9px 10px 8px;background:#303148;color:#fff;border-bottom:3px solid #171724}
.brand{font-weight:1000;font-size:19px}.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:850;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:7px}.stat{font-size:9px;background:#202131;border:2px solid #494b61;border-radius:8px;padding:4px}.bar{height:5px;background:#11111a;border-radius:5px;margin-top:3px}.bar i{height:100%;display:block;border-radius:5px}
#world{position:relative;aspect-ratio:9/12;overflow:hidden;background:#d9c5aa}
#scene{width:100%;height:100%;display:block;image-rendering:pixelated}
.hot{position:absolute;border:0;background:transparent;z-index:4}.hot:active{filter:brightness(1.15)}
#toast{display:none;position:absolute;top:9px;left:50%;transform:translateX(-50%);background:#292638;color:#fff;border:3px solid #777b90;border-radius:12px;padding:7px 10px;font-size:11px;font-weight:950;z-index:8;max-width:88%;text-align:center}
#modal{display:none;position:absolute;inset:0;background:#12121dcc;align-items:flex-end;z-index:10}.sheet{width:100%;max-height:91%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0;padding:12px}
.sheet h2{font-size:18px;margin:0 0 7px}.close{float:right;border:0;background:var(--ink);color:white;border-radius:8px;padding:5px 9px;font-weight:1000}
.btn{width:100%;border:0;border-radius:10px;padding:10px;margin-top:7px;font-weight:950;background:var(--blue);color:#fff}.pink{background:var(--pink)}.green{background:var(--green)}.gold{background:#d3a334;color:#2b230d}.btn:disabled{opacity:.42}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px}.card{background:#fffaf0;border:2px solid #dac4a4;border-radius:12px;padding:8px}.small{font-size:10px;color:#665d54}
.phone{background:#171827;color:white;border:5px solid #35374e;border-radius:24px;padding:12px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.app{border:2px solid #50536c;background:#303349;color:#fff;border-radius:12px;padding:10px 3px;font-weight:900}.app b{display:block;font-size:25px}.chat{padding:8px;background:white;color:var(--ink);border-radius:12px;margin:6px 0;max-width:86%}.me{margin-left:auto;background:#94c9ee}.choice{display:block;width:100%;border:2px solid #d6c1a0;background:#fff;border-radius:10px;padding:9px;margin-top:6px;text-align:left;font-weight:850}
.event{background:#fff9ed;border:3px solid var(--ink);border-radius:13px;padding:10px;margin-top:8px}.meter{height:12px;background:#ddd0bc;border-radius:8px;overflow:hidden}.meter i{height:100%;display:block;background:var(--pink)}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;background:#161622}nav button{border:2px solid #494b61;background:#2d2e43;color:#fff;border-radius:10px;padding:7px 2px;font-size:10px;font-weight:950}nav button.active{background:var(--pink);border-color:#ffd4e1;color:#352432}
</style>
</head>

function date(){open(`<button class="close" onclick="close()">×</button><h2>9. ❤️ Hẹn hò</h2><div class="cards">${[["🍜 Quán ăn",300000,10],["🎬 Rạp phim",500000,8],["🌳 Công viên",200000,7],["☕ Cà phê",150000,6]].map((x,i)=>`<div class="card"><b>${x[0]}</b><p>${cash(x[1])} · ❤️ +${x[2]}</p><button class="btn pink" data-d="${i}">Đi hẹn hò</button></div>`).join("")}</div>`);let ds=[[300000,10],[500000,8],[200000,7],[150000,6]];document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{let [p,l]=ds[+b.dataset.d];if(state.money<p){toast("Không đủ tiền 😅");return}state.money-=p;state.love=clamp(state.love+l);state.trust=clamp(state.trust+3);state.happy=clamp(state.happy+5);state.anger=clamp(state.anger-4);toast("Buổi hẹn rất vui ❤️");top()})}
function shop(){let ks=["sofa","tv","kitchen","fridge","washer","bed","table","plant"],ns={sofa:"🛋️ Sofa",tv:"📺 TV",kitchen:"🍳 Bếp",fridge:"🧊 Tủ lạnh",washer:"🧺 Máy giặt",bed:"🛏️ Giường",table:"🍽️ Bàn ăn",plant:"🌿 Cây cảnh"};open(`<button class="close" onclick="close()">×</button><h2>10. 🛒 Mua sắm & nâng cấp</h2><p class="small">Không di chuyển đồ vật. Chỉ nâng cấp asset tại vị trí cố định.</p><div class="cards">${ks.map(k=>{let l=state.lv[k],p=Math.round(500000*Math.pow(1.55,l-1));return `<div class="card"><b>${ns[k]}</b><div class="small">Cấp ${l}/3</div><button class="btn gold" data-u="${k}" ${l>=3||state.money<p?"disabled":""}>${l>=3?"MAX":"⬆️ "+cash(p)}</button></div>`}).join("")}</div>`);document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{let k=b.dataset.u,p=Math.round(500000*Math.pow(1.55,state.lv[k]-1));if(state.money>=p&&state.lv[k]<3){state.money-=p;state.lv[k]++;state.finance=clamp(state.finance+3);state.happy=clamp(state.happy+2);toast("Nâng cấp thành công!");top();world();shop()}})}
function cohab(){open(`<button class="close" onclick="close()">×</button><h2>11. 👫 Hai người cùng sống</h2><p>Buổi tối sau giờ làm. Hai người có thể tự tạo “nhịp sống” bằng các hoạt động.</p><div class="cards"><div class="card"><b>👨</b><p>Về nhà · 18:10</p></div><div class="card"><b>👩</b><p>Nấu ăn · 18:15</p></div><div class="card"><b>🍚</b><p>Ăn tối · 19:00</p></div><div class="card"><b>📺</b><p>Xem TV · 20:30</p></div></div><button class="btn pink" onclick="toast('Hai người cùng nói chuyện ❤️')">💬 Nói chuyện</button>`)}
function endDay(){open(`<button class="close" onclick="close()">×</button><h2>12. 🌙 Kết thúc ngày</h2><div class="event"><p>❤️ Tình yêu: +${state.today.length+2}</p><p>🤝 Tin tưởng: +2</p><p>😤 Giận: -4</p><p>🏠 Hạnh phúc: +4</p></div><button class="btn pink" id="sleep">🌙 Đi ngủ</button>`);$("sleep").onclick=()=>nextDay()}
function randomEvent(){let r=Math.random();if(r<.25)open(`<button class="close" onclick="close()">×</button><h2>13. 🎲 Sự kiện ngẫu nhiên</h2><div class="event"><b>📞 Mẹ người yêu gọi video</b><p>“Hai đứa ăn cơm chưa?”</p><button class="btn green" onclick="state.happy=clamp(state.happy+3);toast('Trả lời lễ phép: +hạnh phúc');top()">Trả lời</button></div>`);else if(r<.5)open(`<button class="close" onclick="close()">×</button><h2>13. 🎲 Sự kiện ngẫu nhiên</h2><div class="event"><b>🔋 Điện thoại hết pin</b><p>Đúng lúc người yêu đang giận...</p><button class="btn pink" onclick="state.anger=clamp(state.anger+7);toast('Drama tăng 😭');top()">Xử lý</button></div>`);else toast("13. 🎲 Không có drama hôm nay — hiếm lắm 😂")}
function progress(){open(`<button class="close" onclick="close()">×</button><h2>14. 📈 Tiến trình game</h2><div class="event"><b>Chương 1 — MỚI YÊU</b><p>Hẹn hò, nhắn tin, làm quen</p></div><div class="event"><b>Chương 2 — YÊU LÂU</b><p>Cùng đi chơi, tin tưởng, xử lý ghen tuông</p></div><div class="event"><b>Chương 3 — SỐNG CHUNG</b><p>Nhà cửa, việc nhà, tài chính</p></div><div class="event"><b>Chương 4 — HÔN NHÂN</b><p>Trách nhiệm, gia đình</p></div><div class="event"><b>Chương 5 — GIA ĐÌNH</b><p>Cuộc sống lâu dài</p></div>`)}
function status(){open(`<button class="close" onclick="close()">×</button><h2>15. 📊 Thanh trạng thái</h2><p>❤️ Tình yêu <b>${state.love}</b></p><div class="meter"><i style="width:${state.love}%"></i></div><p>🤝 Tin tưởng <b>${state.trust}</b></p><div class="meter"><i style="width:${state.trust}%"></i></div><p>😤 Giận / Căng thẳng <b>${state.anger}</b></p><div class="meter"><i style="width:${state.anger}%"></i></div><p>💰 Tài chính <b>${state.finance}</b></p><div class="meter"><i style="width:${state.finance}%"></i></div><p>🏠 Hạnh phúc <b>${state.happy}</b></p><div class="meter"><i style="width:${state.happy}%"></i></div><div class="event"><b>Ảnh hưởng lẫn nhau</b><p>Có tiền nhưng ít thời gian → tình yêu giảm.</p><p>Hẹn hò nhiều nhưng tiêu quá mức → tài chính giảm.</p><p>Làm việc nhà → giận giảm, hạnh phúc tăng.</p><p>Drama nhiều → sự kiện khó hơn.</p></div>`)}
function nextDay(){state.day++;state.h=7;state.m=30;state.energy=100;state.today=[];state.anger=clamp(state.anger-6);state.happy=clamp(state.happy+2);if(state.day>7){state.day=1;state.money+=12000000;toast("💰 Lương tháng +12.000.000đ")}else toast("🌅 Ngày mới bắt đầu");top();world();save()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");let t=b.dataset.tab;if(t==="home"){world();hotspots()}if(t==="phone")phone();if(t==="work")work();if(t==="date")date();if(t==="shop")shop()});
load();top();world();hotspots();
setTimeout(()=>toast("1. 🏠 Nhà — chạm trực tiếp vào đồ vật để chơi"),800);
</script>
</body></html>
