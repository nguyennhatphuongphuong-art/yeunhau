const $=id=>document.getElementById(id),clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n)),fmt=n=>n.toLocaleString('vi-VN')+'đ';
function hud(){$('time').textContent=`Ngày ${S.day} · ${String(S.h).padStart(2,'0')}:${String(S.m).padStart(2,'0')}`;$('money').textContent=fmt(S.money)}
function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}
function show(t){$('sheet').innerHTML=t+'<button class="btn" id="x">Đóng</button>';$('modal').style.display='flex';$('x').onclick=()=>document.getElementById("modal").style.display="none"}
function hit(x,y,w,h,fn){let b=document.createElement('button');b.className='hot';b.style.cssText=`left:${x/360*100}%;top:${y/480*100}%;width:${w/360*100}%;height:${h/480*100}%`;b.onclick=fn;$('hotspots').appendChild(b)}
function init(){hit(5,90,112,112,()=>cook());hit(110,90,82,112,()=>toast('🧊 Tủ lạnh'));hit(204,62,126,105,()=>toast('📺 Xem TV cùng nhau ❤️'));hit(178,109,180,132,()=>live());hit(200,218,145,110,()=>toast('🍚 Bàn ăn'));hit(268,315,92,101,()=>chores());hit(1,371,177,109,()=>sleep());hit(137,238,168,138,()=>live())}
function cook(){show('<h2>5. 🍳 Nấu ăn — Mini game</h2><p>Chạm đúng thứ tự.</p>'+['🍜 Mì','🥚 Trứng','🥬 Rau','🧂 Gia vị'].map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join(''));let p=0;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(+b.dataset.i!==p){S.anger=clamp(S.anger+3);hud();toast('Sai nguyên liệu 😅');return}b.disabled=true;p++;if(p===4){S.money+=180000;S.love=clamp(S.love+5);S.happy=clamp(S.happy+5);hud();toast('Món ăn thành công +180.000đ')}})}
function chores(){show('<h2>6. 🧹 Việc nhà</h2>'+['Rửa bát','Giặt quần áo','Đổ rác','Lau nhà'].map(x=>`<button class="choice">☐ ${x}</button>`).join(''));document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent=b.textContent.replace('☐','☑');S.happy=clamp(S.happy+2);S.anger=clamp(S.anger-2);hud()})}
function live(){show('<h2>11. 👫 Hai người cùng sống</h2><p>18:10 — Cả hai vừa về nhà.</p><div class="cards"><div class="card">🍳 Nấu ăn</div><div class="card">🍚 Ăn tối</div><div class="card">📺 Xem TV</div><div class="card">💬 Tâm sự</div></div><button class="btn pink" onclick="S.love=clamp(S.love+4);S.trust=clamp(S.trust+3);S.happy=clamp(S.happy+3);hud();toast(\'Tâm sự thật lâu ❤️\')">💬 Tâm sự</button>')}
function phone(){show('<h2>2. 📱 Điện thoại</h2><div class="cards"><button class="choice" onclick="msg()">💬 Tin nhắn</button><button class="choice" onclick="drama()">😤 Ghen</button><button class="choice" onclick="finance()">🏦 Ngân hàng</button><button class="choice" onclick="social()">📸 Mạng xã hội</button><button class="choice" onclick="progress()">📈 Tiến trình</button><button class="choice" onclick="status()">📊 Trạng thái</button></div>')}
function msg(){show('<h2>3. 💬 Tin nhắn</h2><p class="card">Em yêu: Anh đang làm gì đấy?</p><p class="card">Anh: Anh đang ở nhà nè.</p><p class="card">Em: Sao rep lâu thế? Ai vừa nhắn cho anh vậy? 😤</p><button class="choice" onclick="S.trust=clamp(S.trust+4);S.anger=clamp(S.anger-5);hud();toast(\'Giải thích rõ ràng ❤️\')">❤️ Anh đang nói chuyện với em.</button>')}
function drama(){show('<h2>4. 😤 Ghen tuông</h2><p>Tin nhắn: “Tối nay đi cà phê không? ❤️”</p><p>Mức giận: '+S.anger+'/100</p><button class="btn" onclick="S.trust=clamp(S.trust+5);S.anger=clamp(S.anger-12);hud();toast(\'Drama hạ nhiệt\')">💬 Giải thích</button><button class="btn pink" onclick="S.trust=clamp(S.trust+4);S.anger=clamp(S.anger-8);hud();toast(\'Gọi điện ❤️\')">📞 Gọi điện</button>')}
function finance(){show('<h2>8. 💰 Tài chính</h2><div class="cards"><div class="card">Lương<br><b>12.000.000đ</b></div><div class="card">Hiện có<br><b>'+fmt(S.money)+'</b></div></div>')}
function social(){show('<h2>📸 Mạng xã hội</h2><div class="card">“Người yêu tôi bảo không đói.”<br>5 phút sau: “Anh ơi mua trà sữa nhé.” 😂</div><div class="card">“Hôm nay chúng tôi không cãi nhau.”<br>18:03 — 37 tin nhắn.</div>')}
function work(){show('<h2>7. 💼 Đi làm</h2><p>Năng lượng '+S.energy+'%</p><button class="btn" onclick="S.money+=160000;S.energy=Math.max(0,S.energy-7);hud();toast(\'+160.000đ\')">📧 Xử lý email</button><button class="btn" onclick="S.money+=220000;S.energy=Math.max(0,S.energy-10);hud();toast(\'+220.000đ\')">📄 Làm báo cáo</button>')}
function date(){show('<h2>9. ❤️ Hẹn hò</h2><div class="cards"><div class="card">🍜 Quán ăn<br>300.000đ<button class="btn pink" onclick="goDate(300000,10)">Đi</button></div><div class="card">🎬 Rạp phim<br>500.000đ<button class="btn pink" onclick="goDate(500000,8)">Đi</button></div><div class="card">🌳 Công viên<br>200.000đ<button class="btn pink" onclick="goDate(200000,7)">Đi</button></div><div class="card">☕ Cà phê<br>150.000đ<button class="btn pink" onclick="goDate(150000,6)">Đi</button></div></div>')}
