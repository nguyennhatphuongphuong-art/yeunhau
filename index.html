 day:2,h:18,m:35,money:3200000,love:78,trust:74,anger:12,finance:61,happy:84,energy:76,
 upgrades:{sofa:1,tv:1,kitchen:1,fridge:1,bed:1},
 chores:{dish:false,laundry:false,trash:false,floor:false},
 work:{email:0,report:0,meeting:0},
 chatIndex:0, socialIndex:0, lastRoutine:-1, player:'boy', partner:'girl', inventory:{rice:2,veg:2,fish:1,meat:1,shrimp:1,egg:6,noodle:4}, fridgeOpen:false, pet:{type:'cat',name:'Miu',hunger:72,happy:78,clean:84,energy:88}, unread:0, inbox:{love:[],best:[],friend:[],family:[],coworker:[]}, messageSeq:0, cooking:null, scene:'home', clean:100, playerGenderChosen:true
};

function hud(){
 $('time').textContent=`Ngày ${S.day} · ${String(S.h).padStart(2,'0')}:${String(S.m).padStart(2,'0')}`;
 $('money').textContent=fmt(S.money);
 const vals=[S.love,S.trust,S.anger,S.finance,S.happy];
 document.querySelectorAll('.stat').forEach((e,i)=>{
   const t=e.childNodes[0]; if(t) t.textContent=['❤️ '+S.love,'🤝 '+S.trust,'😤 '+S.anger,'💰 '+S.finance,'🏠 '+S.happy][i];

 });
}
function toast(t){
 const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);

}

}

function changeTime(min){

}
function effect(kind,n=1){

function fx(emoji,x=50,y=45){

}
function say(text,who='girl',ms=2200){
 const e=$('speech');e.textContent=text;e.style.display='block';
 const c=$(who); if(c){e.style.left=(parseFloat(c.style.left)||50)+8+'%';e.style.top=Math.max(4,(parseFloat(c.style.top)||50)-8)+'%';c.classList.add('talking');setTimeout(()=>c.classList.remove('talking'),ms)}
 clearTimeout(window.speechTimer);window.speechTimer=setTimeout(()=>e.style.display='none',ms);
}

async function moveNPC(who,left,top,text){

 c.style.display='block';c.classList.add('walking');c.style.left=left+'%';c.style.top=top+'%';

function say(text,who='girl',ms=2200){const e=$('speech');e.textContent=text;e.style.display='block';const c=$(who);if(c){e.style.left=(parseFloat(c.style.left)||50)+8+'%';e.style.top=Math.max(4,(parseFloat(c.style.top)||50)-8)+'%';c.classList.add('talking');setTimeout(()=>c.classList.remove('talking'),ms)}clearTimeout(window.speechTimer);window.speechTimer=setTimeout(()=>e.style.display='none',ms)}
function fx(emoji,x=50,y=45){const f=document.createElement('div');f.className='fx';f.textContent=emoji;f.style.left=x+'%';f.style.top=y+'%';$('roomFX').appendChild(f);setTimeout(()=>f.remove(),950)}
async function routine(scene='idle'){
 if(S.scene!=='home')return;
 if(scene==='cook'){await moveNPC('boy',34,47,'Để anh lấy đồ!');await moveNPC('girl',23,49,'Em nấu nhé 😋')}
 else if(scene==='tv'){await moveNPC('boy',39,55,'Bật TV nha.');await moveNPC('girl',57,57,'Ngồi sát vào!');tvOn()}

 else if(scene==='fight'){await moveNPC('girl',65,51,'Anh giải thích đi! 😤');await moveNPC('boy',33,51,'Khoan... khoan...')}
}

function init(){

 hit(110,90,82,112,()=>fridge());
 hit(204,62,126,105,()=>{routine('tv');show(`<h2>📺 Xem TV</h2><p class="card">Hai người cùng ngồi sofa. TV đang chiếu một chương trình đơn giản.</p>${btn('😂 Nhường remote','effect("happy",3);effect("love",2);hud();toast("Anh nhường remote 😌")')}${btn('😤 Tranh remote','effect("anger",5);effect("trust",-2);hud();toast("Chiến tranh lạnh bắt đầu")','pink')}`)});
 hit(178,109,180,132,()=>live());
 hit(200,218,180,132,()=>{routine('table');show(`<h2>🍚 Bàn ăn</h2><p class="card">Bàn ăn chỉ có ý nghĩa khi có đồ ăn thật.</p>${btn('🥢 Ăn cùng nhau','eatMeal()')}`)});
 hit(268,315,92,101,()=>chores());
 hit(1,371,177,109,()=>sleep());
 hit(137,238,168,138,()=>live());
 hit(250,360,75,80,()=>petMenu());
 homeSchedule();

function fridge(){
 show(`<h2>🧊 Tủ lạnh</h2><p>Thực phẩm còn lại:</p><div class="cards">${[['rice','🍚 Gạo'],['veg','🥬 Rau'],['fish','🐟 Cá'],['meat','🥩 Thịt'],['shrimp','🦐 Tôm'],['egg','🥚 Trứng'],['noodle','🍜 Mì']].map(x=>`<div class="card">${x[1]}<br><b>${S.inventory[x[0]]}</b></div>`).join('')}</div><button class="btn gold" onclick="grocery()">🛒 Đi chợ</button><button class="btn" onclick="cook()">🍳 Chọn món nấu</button>`)
}
function grocery(){
 setScene('market','🛒 ĐI CHỢ',`<div class="marketScene"><div class="stall stall1"></div><div class="stall stall2"></div><div class="stall stall3"></div><div class="marketItem mi1">🥬 🥩</div><div class="marketItem mi2">🐟 🦐</div><div class="marketItem mi3">🥚 🍜</div><div class="marketNPC" id="marketGuy">🧑‍🌾</div></div>`);show(`<h2>🛒 Đi chợ</h2><p>Đồ mua sẽ xuất hiện ngay trong tủ lạnh.</p><div class="cards">${[['rice','🍚 Gạo',30000],['veg','🥬 Rau',25000],['fish','🐟 Cá',70000],['meat','🥩 Thịt',90000],['shrimp','🦐 Tôm',110000],['egg','🥚 Trứng',30000],['noodle','🍜 Mì',15000]].map(x=>`<div class="card"><b>${x[1]}</b><br>${fmt(x[2])}<button class="btn pink" onclick="buyFood('${x[0]}',${x[2]})">Mua</button></div>`).join('')}</div>`)
}
function buyFood(k,cost){if(S.money<cost)return toast('Không đủ tiền 😅');S.money-=cost;S.inventory[k]++;hud();toast('🧊 Đã cất vào tủ lạnh');}
function cook(){
 if(S.scene!=='home')returnHomeScene();routine('cook');
 const recipes=[{name:'🍜 Mì',need:{noodle:1,egg:1,veg:1},steps:[['🔥 Bật bếp — làm nóng',15],['💧 Đun nước sôi',10],['🍜 Pha mì',5],['🍽️ Bê ra bàn',5]]},{name:'🍳 Trứng rau',need:{egg:2,veg:1},steps:[['🔥 Bật bếp — làm nóng',15],['🍳 Chiên trứng',8],['🥬 Cho rau',5],['🍽️ Bê ra bàn',5]]}];
 const r=recipes[Math.floor(Math.random()*recipes.length)];for(const k in r.need){if(S.inventory[k]<r.need[k])return fridge()}
 for(const k in r.need)S.inventory[k]-=r.need[k];
 S.cooking={recipe:r,step:0,remain:r.steps[0][1],deadline:0};
 renderCookStep();
}
function renderCookStep(){const c=S.cooking;if(!c)return;const step=c.recipe.steps[c.step];show(`<h2>🍳 ${c.recipe.name}</h2><p><b>${step[0]}</b></p><div class="taskbar"><i id="cookbar" style="width:100%"></i></div><p>Còn <b id="cooktime">${step[1]}</b> giây</p><p class="card">NPC có thể tự đi lại trong lúc bếp đang hoạt động.</p><button class="btn pink" id="cookWait">⏳ Bắt đầu bước</button>`);$('cookWait').onclick=()=>runCookTimer()}
function runCookTimer(){const c=S.cooking;if(!c)return;const step=c.recipe.steps[c.step];let remain=step[1];$('cookWait').disabled=true;const iv=setInterval(()=>{remain--;if($('cooktime'))$('cooktime').textContent=remain;if($('cookbar'))$('cookbar').style.width=(remain/step[1]*100)+'%';if(remain<=0){clearInterval(iv);finishCookStep()}},1000)}
async function finishCookStep(){const c=S.cooking;c.step++;if(c.step>=c.recipe.steps.length){S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(1);hud();routine('table');show(`<h2>🍽️ Món ăn đã được bê ra bàn</h2><div class="card">Hai người ăn tối cùng nhau. Không nhận tiền — đây là bữa cơm của nhà mình ❤️</div>${btn('🥢 Ăn cùng nhau','eatMeal()')}`);return}if(c.step===c.recipe.steps.length-1){c.deadline=5;show(`<h2>🍽️ ${c.recipe.name} đã chín!</h2><p class="card">Nhanh tay bê ra bàn trong <b id="serveSec">5</b>s. Không bê kịp → cháy món → cháy nhà.</p><button class="btn pink" onclick="serveMeal()">🍽️ Bê ra bàn ngay</button>`);let n=5;const sv=setInterval(()=>{n--;if($('serveSec'))$('serveSec').textContent=n;if(n<=0){clearInterval(sv);if(S.cooking)fireReset()}},1000);return}renderCookStep();}
function serveMeal(){if(!S.cooking)return;S.cooking=null;effect('love',4);effect('happy',4);effect('trust',2);changeTime(1);hud();routine('table');show(`<h2>🍽️ Đã bê món ra bàn</h2><div class="card">Bữa cơm gia đình hoàn thành. Không nhận tiền — đây là đồ ăn cho hai người ❤️</div>${btn('🥢 Ăn cùng nhau','eatMeal()')}`)}
function eatMeal(){if(S.scene!=='home')returnHomeScene();effect('love',3);effect('happy',5);effect('anger',-2);changeTime(20);hud();toast('🍜 Bữa tối ngon lành ❤️');routine('table')}
function fireReset(){alert('🔥 Cháy nhà! Hai người phải bắt đầu lại từ đầu.');location.reload()}
function chores(){const list=[['dish','🍽️ Rửa bát','girl'],['laundry','👕 Giặt quần áo','boy'],['trash','🗑️ Đổ rác','girl'],['floor','🧹 Lau nhà','boy']];show('<h2>6. 🧹 Việc nhà</h2><p>NPC sẽ thật sự đi tới vị trí và làm việc.</p>'+list.map(([k,x,w])=>`<button class="choice" onclick="doChore('${k}','${w}')">${S.chores[k]?'☑️':'☐'} ${x}</button>`).join('')+'<p class="card">Độ sạch nhà: '+S.clean+'%</p>')}
async function doChore(k,who){if(S.chores[k])return;closeModal();if(S.scene!=='home')returnHomeScene();const pos={dish:[68,61],laundry:[78,75],trash:[15,62],floor:[55,72]}[k];await moveNPC(who,pos[0],pos[1]);say(k==='dish'?'Rửa bát xong!':k==='laundry'?'Máy giặt chạy rồi!':k==='trash'?'Đổ rác rồi 😎':'Lau nhà mỏi cả lưng 😂',who);S.chores[k]=true;S.clean=clamp(S.clean+5);effect('happy',2);effect('anger',-2);changeTime(8);hud();chores()}

const contacts={love:{name:'❤️ Người yêu',avatar:'👩',messages:[['Em: Anh đang làm gì đấy?','Anh: Anh đang ở nhà nè.'],['Em: Sao rep lâu thế? Ai vừa nhắn cho anh vậy? 😤','Anh: Không có ai đâu 😅'],['Em: Tối nay có nấu gì cho em không?','Anh: Có chứ ❤️']]},best:{name:'🧑 Bạn thân',avatar:'🧑',messages:[['Bạn: Tối nay đá bóng không?','Anh: Để xem lịch đã.'],['Bạn: Ông có người yêu rồi quên anh em à 😂','Anh: Không quên!']]},friend:{name:'👩 Bạn khác giới',avatar:'👩',messages:[['Bạn: Mai đi cà phê không?','Anh: Để tôi xem đã.'],['Bạn: Nhớ mang laptop nhé.','Anh: Ok.']]},family:{name:'👪 Gia đình',avatar:'👪',messages:[['Mẹ: Cuối tuần về ăn cơm nhé.','Con: Dạ.'],['Mẹ: Nhớ gọi cho mẹ.','Con: Vâng ạ.']]},coworker:{name:'💼 Đồng nghiệp',avatar:'🧑‍💼',messages:[['Đồng nghiệp: Mai họp 8h nhé.','Ok.'],['Đồng nghiệp: Gửi giúp file nhé.','Được.']]}};
function phone(){show(`<h2>2. 📱 Điện thoại</h2><p>Tin nhắn đến bất chợt. Có nhiều người nhắn, không chỉ người yêu.</p><div class="cards"><button class="choice" onclick="inbox()">💬 Tin nhắn ${S.unread?'<span class="notif">'+S.unread+'</span>':''}</button><button class="choice" onclick="social()">📸 MXH</button><button class="choice" onclick="grocery()">🛒 Đi chợ</button><button class="choice" onclick="petMenu()">🐾 Thú cưng</button><button class="choice" onclick="finance()">🏦 Ngân hàng</button><button class="choice" onclick="status()">📊 Trạng thái</button><button class="choice" onclick="characterMenu()">👤 Nhân vật</button></div>`)}
function inbox(){show(`<h2>3. 💬 Tin nhắn</h2>${Object.entries(contacts).map(([k,c])=>`<button class="choice" onclick="chat('${k}')">${c.avatar} <b>${c.name}</b>${S.inbox[k].length?'<span class="notif" style="float:right">'+S.inbox[k].length+'</span>':''}</button>`).join('')}`)}
function chat(k){const c=contacts[k];const arr=S.inbox[k];let text=c.messages[S.messageSeq%c.messages.length];if(arr.length)text=arr.shift();S.unread=Math.max(0,S.unread-1);show(`<h2>${c.avatar} ${c.name}</h2><div class="chat"><div class="bubble">${text[0]}</div><div class="bubble me">${text[1]}</div></div><div style="display:flex;gap:6px;margin-top:8px"><input id="chatInput" maxlength="120" placeholder="Nhập tin nhắn..." style="flex:1;padding:11px;border:2px solid #dac4a4;border-radius:10px;font-size:13px"><button class="btn pink" style="width:90px;margin-top:0" onclick="sendMessage('${k}')">Gửi</button></div>${k==='love'?`<p><b>Phản hồi nhanh:</b></p>${btn('❤️ Anh chỉ nói chuyện với em.','replyLove("good")','choice')}${btn('😅 Bạn thôi mà.','replyLove("soft")','choice')}${btn('🙄 Đang bận, lát nói.','replyLove("bad")','choice')}`:''}${btn('⬅️ Danh sách','inbox()')}`)}
function sendMessage(k){const input=$('chatInput');const text=(input?.value||'').trim();if(!text)return toast('Viết gì đó trước đã 😅');if(k==='love'){const low=text.toLowerCase();if(/(cà phê|caphe|đi chơi|tối nay)/.test(low)){effect('anger',4);effect('trust',-1)}else if(/(yêu|nhớ|thương|ăn chưa|nấu|về chưa)/.test(low)){effect('love',3);effect('trust',2);effect('anger',-2)}else effect('trust',1)}else effect('trust',1);S.messageSeq++;changeTime(2);hud();toast('📤 Đã gửi tin nhắn');chat(k)}
function replyLove(t){if(t==='good'){effect('trust',5);effect('love',3);effect('anger',-6)}if(t==='soft'){effect('trust',2);effect('anger',-1)}if(t==='bad'){effect('trust',-5);effect('anger',7)}changeTime(5);hud();toast(t==='bad'?'😤 Người yêu bắt đầu nghi ngờ':'❤️ Tin tưởng tăng');chat('love')}
function genericReply(k){effect('trust',1);changeTime(2);hud();toast('Đã trả lời '+contacts[k].name);chat(k)}
function randomMessage(){const keys=Object.keys(contacts);const k=keys[Math.floor(Math.random()*keys.length)];const c=contacts[k];const m=c.messages[Math.floor(Math.random()*c.messages.length)];S.inbox[k].push(m);S.unread++;fx('📱',82,15);toast('📱 '+c.name+' vừa nhắn');}
function social(){const p=posts[S.socialIndex%posts.length];show(`<h2>📸 Mạng xã hội</h2><div class="post"><b>${p[0]}</b><p>${p[1]}</p><small>${p[2]}</small></div>${btn('❤️ Thả tim','effect("love",1);hud();toast("Đã thả tim")','pink')}${btn('💬 Bình luận','effect("happy",1);hud();toast("Đã bình luận")','choice')}${btn('➡️ Lướt bài tiếp','socialNext()','btn')}`)}

const tasks=[['email','📧 Xử lý email',3],['report','📄 Làm báo cáo',3],['meeting','👥 Họp online',2]];
function work(){if(S.scene==='home'){setScene('office','🏢 VĂN PHÒNG',`<div class="office"><div class="officeDesk desk1"></div><div class="officeDesk desk2"></div><div class="officeDesk desk3"></div><div class="officePC pc1"></div><div class="officePC pc2"></div><div class="officePC pc3"></div><div class="officeNPC" style="left:12%;bottom:29%">🧑‍💼</div><div class="officeNPC" style="left:43%;bottom:29%">🧑‍💻</div><div class="officeNPC" style="right:12%;bottom:29%">👩‍💼</div></div>`)}show(`<h2>7. 💼 Đi làm</h2><p>⏱️ Mỗi nhiệm vụ kéo dài 5–10 giây.</p><p>Năng lượng: <b>${S.energy}%</b></p>${tasks.map(t=>`<button class="choice" onclick="doWorkReal('${t[0]}','${t[1]}',${t[2]})">${t[1]} <span style="float:right">${S.work[t[0]]}/${t[2]}</span></button>`).join('')}<p class="card">Lịch đối phương: ${S.h>=7&&S.h<11||S.h>=14&&S.h<17?'đang ở văn phòng':'đã về nhà'}</p>`)}
function doWorkReal(k,label,max){if(S.energy<8)return toast('Hết năng lượng 😵');let sec=5+Math.floor(Math.random()*6);show(`<h2>🏢 ${label}</h2><p>Đang làm việc...</p><div class="taskbar"><i id="workbar" style="width:100%"></i></div><b id="worksec">${sec}s</b>`);let n=sec;const iv=setInterval(()=>{n--;if($('worksec'))$('worksec').textContent=n+'s';if($('workbar'))$('workbar').style.width=(n/sec*100)+'%';if(n<=0){clearInterval(iv);S.work[k]=Math.min(max,S.work[k]+1);S.energy=clamp(S.energy-8);changeTime(sec);if(S.work.email>=3&&S.work.report>=3&&S.work.meeting>=2){S.money+=900000;S.finance=clamp(S.finance+5);S.work={email:0,report:0,meeting:0};toast('💰 Hoàn thành ca +900.000đ')}else toast('✅ Hoàn thành '+label);hud();work()}},1000)}
const dates=[['🍜 Quán ăn','food',300000,10,'Anh chọn món, em chọn quán nhé!'],['🎬 Rạp phim','cinema',500000,8,'Ai được chọn phim? Người cầm ví quyết định 😂'],['🌳 Công viên','park',200000,7,'Đi bộ 20 phút mà nói chuyện 2 tiếng.'],['☕ Cà phê','cafe',150000,6,'Cà phê hay drama? Hôm nay chọn cả hai.']];
function date(){show(`<h2>9. ❤️ Hẹn hò</h2><p>Chọn địa điểm — mỗi nơi có background riêng.</p><div class="cards">${dates.map((d,i)=>`<div class="card"><b>${d[0]}</b><br>${fmt(d[2])}<p>${d[4]}</p><button class="btn pink" onclick="goDate(${i})">Đi</button></div>`).join('')}</div>`)}
async function goDate(i){const d=dates[i];if(S.money<d[2])return toast('Không đủ tiền 😅');S.money-=d[2];effect('love',d[3]);effect('trust',3);effect('happy',5);changeTime(60);setScene('date','❤️ '+d[0],`<div class="dateScene ${d[1]}"><div class="dateLight"></div><div class="dateObj dateTable"></div><div class="dateObj dateBench"></div><div class="dateScreen"></div><div class="dateTree"></div><div class="dateNPC dateBoy">🧑</div><div class="dateNPC dateGirl">👩</div></div>`);await waitMs(400);toast('❤️ Hai người đã tới nơi');show(`<h2>${d[0]}</h2><div class="card">${d[4]}<br><b>❤️ +${d[3]} · 🤝 +3 · 🏠 +5</b></div>${btn('💬 Tâm sự','effect("love",2);effect("trust",2);hud();toast("Buổi hẹn vui hơn ❤️")')}`)}
function characterMenu(){show(`<h2>👤 Nhân vật</h2><p>Chọn nhân vật người chơi. Lịch người yêu sẽ tự thay đổi.</p>${btn('👨 Chơi nhân vật nam','setGender("boy")','pink')}${btn('👩 Chơi nhân vật nữ','setGender("girl")','pink')}`)}
function setGender(g){S.player=g;S.partner=g==='boy'?'girl':'boy';closeModal();toast(g==='boy'?'👨 Bạn là nam — người yêu nữ đi làm theo ca.':'👩 Bạn là nữ — người yêu nam đi làm theo ca.');homeSchedule();}
function petMenu(){show(`<h2>🐾 Thú cưng — ${S.pet.name}</h2><div class="petPanel"><div class="petStat">🍗 Đói<br><b>${S.pet.hunger}/100</b></div><div class="petStat">😊 Vui<br><b>${S.pet.happy}/100</b></div><div class="petStat">🧼 Sạch<br><b>${S.pet.clean}/100</b></div><div class="petStat">⚡ Năng lượng<br><b>${S.pet.energy}/100</b></div></div>${btn('🍖 Cho ăn','petAction("feed")','pink')}${btn('🎾 Chơi','petAction("play")','choice')}${btn('🧼 Tắm','petAction("clean")','choice')}${btn('🐾 Gọi lại','petFollow()','choice')}`)}
async function petAction(a){closeModal();if(a==='feed'){S.pet.hunger=clamp(S.pet.hunger+20);S.pet.happy=clamp(S.pet.happy+4);toast('🐾 '+S.pet.name+' ăn ngon lành')}if(a==='play'){S.pet.happy=clamp(S.pet.happy+12);S.pet.energy=clamp(S.pet.energy-8);await petMove(55,65);toast('🎾 '+S.pet.name+' chạy quanh nhà')}if(a==='clean'){S.pet.clean=clamp(S.pet.clean+25);toast('🧼 '+S.pet.name+' sạch sẽ rồi')}fx('❤️',78,70);hud()}
async function petMove(l,t){const p=$('pet');p.style.left=l+'%';p.style.top=t+'%';await waitMs(900)}
function petFollow(){closeModal();petMove(48,72);toast('🐾 '+S.pet.name+' chạy theo bạn')}
function petTick(){S.pet.hunger=clamp(S.pet.hunger-1);S.pet.energy=clamp(S.pet.energy+1);S.pet.clean=clamp(S.pet.clean-1);if(S.pet.hunger<25||S.pet.clean<30)toast('🐾 '+S.pet.name+' đang cần bạn');}

const upgradeData={
 sofa:{name:'🛋️ Sofa',cost:[0,500000,900000],max:3,stat:'happy'},
 tv:{name:'📺 TV',cost:[0,700000,1200000],max:3,stat:'happy'},
 kitchen:{name:'🍳 Bếp',cost:[0,800000,1500000],max:3,stat:'love'},
 fridge:{name:'🧊 Tủ lạnh',cost:[0,600000,1100000],max:3,stat:'finance'},
 bed:{name:'🛏️ Giường',cost:[0,900000,1800000],max:3,stat:'happy'}
};
function shop(){show(`<h2>10. 🛒 Nâng cấp nhà</h2><p>Đồ vật cố định vị trí. Nâng cấp sẽ thay đổi hình thức và hiệu ứng ngay tại chỗ.</p><div class="cards">${Object.entries(upgradeData).map(([k,d])=>{const lv=S.upgrades[k],cost=d.cost[lv]||0;return `<div class="card"><b>${d.name}</b><br>Cấp ${lv}/${d.max}<br>${lv<d.max?'Nâng cấp: '+fmt(cost):'ĐÃ TỐI ĐA'}<button class="btn gold" ${lv>=d.max?'disabled':''} onclick="upgrade('${k}')">⬆️ ${lv<d.max?'Nâng cấp':'Tối đa'}</button></div>`}).join('')}</div>`)}
function upgrade(k){const d=upgradeData[k],lv=S.upgrades[k],cost=d.cost[lv];if(lv>=d.max)return toast('Đã tối đa ⭐');if(S.money<cost)return toast('Chưa đủ tiền 😅');S.money-=cost;S.upgrades[k]++;effect(d.stat,4);effect('finance',-2);hud();visualUpgrade(k);fx('⬆️',55,55);toast(`${d.name} đã được thay bằng phiên bản mới`);shop()}
function visualUpgrade(k){const map={sofa:0,tv:1,kitchen:2,fridge:3,bed:4};const idx=map[k];const all=document.querySelectorAll('.asset');const e=all[idx];if(!e)return;e.dataset.level=S.upgrades[k];e.classList.add('upgrade-ready');e.style.filter=`saturate(${1+S.upgrades[k]*.18}) brightness(${1+S.upgrades[k]*.06})`;e.style.transform=`scale(${1+S.upgrades[k]*.025})`;let badge=e.querySelector('.lvbadge');if(!badge){badge=document.createElement('div');badge.className='lvbadge';e.appendChild(badge)}badge.textContent='Lv '+S.upgrades[k]}
function finance(){
 show(`<h2>8. 💰 Tài chính</h2><div class="cards">
 <div class="card">💵 Tiền mặt<br><b>${fmt(S.money)}</b></div>
 <div class="card">📈 Chỉ số tài chính<br><b>${S.finance}/100</b></div></div>
 <button class="choice" onclick="budget('save')">🐷 Tiết kiệm 300.000đ → +3 tài chính</button>
 <button class="choice" onclick="budget('fun')">🍰 Chi 150.000đ cho người yêu → +5 hạnh phúc</button>
 <button class="choice" onclick="budget('bill')">💡 Trả hóa đơn 400.000đ → +4 tin tưởng</button>`);
}
function budget(k){
 if(k==='save'){if(S.money<300000)return toast('Không đủ tiền');S.money-=300000;effect('finance',3)}
 if(k==='fun'){if(S.money<150000)return toast('Không đủ tiền');S.money-=150000;effect('happy',5);effect('love',2)}
 if(k==='bill'){if(S.money<400000)return toast('Không đủ tiền');S.money-=400000;effect('trust',4);effect('happy',2)}
 hud();finance();
}
function progress(){
 show(`<h2>14. 📈 Tiến trình game</h2>
 <div class="card"><b>Chương 1 — MỚI YÊU</b><br>Hẹn hò, nhắn tin ${S.love>=50?'✅':''}</div>
 <div class="card"><b>Chương 2 — YÊU LÂU</b><br>Ghen tuông, xây dựng tin tưởng ${S.trust>=60?'✅':''}</div>
 <div class="card"><b>Chương 3 — SỐNG CHUNG</b><br>Nhà cửa, việc nhà, tài chính ${S.happy>=60?'✅':''}</div>
 <div class="card"><b>Chương 4 — HÔN NHÂN</b><br>Trách nhiệm ${S.trust>=80?'🔓 Đã mở':'🔒 Chưa mở'}</div>
 <div class="card"><b>Chương 5 — GIA ĐÌNH</b><br>Cuộc sống lâu dài ${S.love>=90&&S.trust>=90?'🔓 Đã mở':'🔒 Chưa mở'}</div>`);
}
function status(){
 show(`<h2>15. 📊 Thanh trạng thái</h2>`+
 [['❤️ Tình yêu',S.love],['🤝 Tin tưởng',S.trust],['😤 Giận / Căng thẳng',S.anger],['💰 Tài chính',S.finance],['🏠 Hạnh phúc',S.happy],['⚡ Năng lượng',S.energy]].map(x=>`<p>${x[0]} <b style="float:right">${x[1]}</b></p><div class="taskbar"><i style="width:${x[1]}%;background:${x[0].startsWith('😤')?'#e66d78':'#e77da5'}"></i></div>`).join(''));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 ({home:()=>{closeModal();toast('🏠 Về nhà')},phone,work,date,shop}[b.dataset.tab])();
});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('world').insertAdjacentHTML('beforeend','<div id="roomFX"></div><div id="speech"></div>');
init();hud();homeSchedule();toast('🏠 Nhà đã sẵn sàng — NPC có lịch, tin nhắn bất chợt và thú cưng');
setTimeout(()=>routine('idle'),600);
setInterval(()=>{ if(Math.random()<0.62) randomMessage(); },9000);
setInterval(()=>{ if(S.scene==='home' && Math.random()<0.45){ const spots=[[72,74],[82,65],[58,76],[28,68]]; const q=spots[Math.floor(Math.random()*spots.length)]; petMove(q[0],q[1]); }},7000);
setInterval(()=>{
 changeTime(2);
 homeSchedule();
 petTick();
 if(S.energy<100 && S.h>=7 && S.h<18)S.energy=clamp(S.energy+1);
 // autonomous couple routine: NPCs no longer stand frozen
 const slot=Math.floor((Date.now()/1000)/7)%6;
 if(slot!==S.lastRoutine){
   S.lastRoutine=slot;
   const scenes=['cook','tv','table','idle','tv','table'];
   if(scenes[slot]!=='idle')routine(scenes[slot]);
 }
},2000);
</script></body></html>
